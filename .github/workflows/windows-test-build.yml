name: Windows Test Build

# 临时体验包构建：手动触发，产出未签名的 NSIS 安装包 artifact。
# 不发布 GitHub Release、不要求签名密钥；更新端点未配置时应用会
# 在设置页诚实显示"更新服务未配置"。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-installer:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build Windows installer (NSIS, unsigned)
        run: pnpm tauri build --bundles nsis

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: relaydesk-windows-nsis
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
