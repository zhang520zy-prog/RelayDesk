name: Desktop Test Build

# 临时体验包构建：手动触发，一次产出三个平台的未签名安装包 artifact。
# - Windows: NSIS .exe
# - macOS: .dmg（Apple Silicon；Intel Mac 需改用 macos-13 runner）
# - Linux: .deb + .AppImage
# 不发布 GitHub Release、不要求签名密钥；更新端点未配置时应用会
# 在设置页诚实显示"更新服务未配置"。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
            artifact: relaydesk-windows-nsis
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/nsis/*.nsis.zip
              src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          - os: macos-latest
            bundles: dmg
            artifact: relaydesk-macos-dmg-arm64
            artifact-path: |
              src-tauri/target/release/bundle/dmg/*.dmg
              src-tauri/target/release/bundle/macos/*.app.tar.gz
              src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: relaydesk-linux-deb-appimage
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
              src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz.sig

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build installer (${{ matrix.os }}, unsigned)
        env:
          # 更新器签名密钥（仓库 Secret；本地仓库不含私钥）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # 编译期注入更新端点：未设置时应用诚实显示"更新服务未配置"
          RELAYDESK_UPDATE_ENDPOINT: https://github.com/zhang520zy-prog/RelayDesk/releases/download/test-build/latest.json
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # 汇总成功的平台产物，发布为滚动 pre-release，供公开下载（无需登录）。
  release:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: relaydesk-*
          merge-multiple: true
          path: dist

      # 由 *.sig 更新器产物拼装 latest.json（Tauri updater 清单）
      - name: Generate updater manifest (latest.json)
        run: |
          python3 - <<'PY'
          import glob, json, os, re, datetime
          base = "https://github.com/zhang520zy-prog/RelayDesk/releases/download/test-build"
          platforms = {}
          version = ""
          for sig in glob.glob("dist/**/*.sig", recursive=True):
              asset = sig[:-4]  # strip .sig
              name = os.path.basename(asset)
              with open(sig) as f:
                  signature = f.read().strip()
              if name.endswith(".nsis.zip"):
                  key = "windows-x86_64"
              elif name.endswith(".app.tar.gz"):
                  key = "darwin-aarch64"
              elif name.endswith(".AppImage.tar.gz"):
                  key = "linux-x86_64"
              else:
                  continue
              m = re.search(r"_(\d+\.\d+\.\d+)", name)
              if m and not version:
                  version = "v" + m.group(1)
              platforms[key] = {
                  "signature": signature,
                  "url": f"{base}/{name}",
              }
          manifest = {
              "version": version or "v0.0.0",
              "notes": "RelayDesk test build",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platforms": platforms,
          }
          with open("dist/latest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          print(json.dumps(manifest, indent=2))
          PY

      - name: Publish rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: RelayDesk Test Build
          prerelease: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.nsis.zip
            dist/**/*.app.tar.gz
            dist/**/*.AppImage.tar.gz
            dist/**/*.sig
            dist/latest.json
          body: |
            未签名测试包。Windows 点"仍要运行"；macOS 需
            `xattr -dr com.apple.quarantine /Applications/RelayDesk.app`
            或右键打开；Linux 用 `.deb` 或 `.AppImage`（需 libfuse2）。
            已启用应用内自动更新：安装后设置页可检查更新。
