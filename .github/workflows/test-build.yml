name: Desktop Test Build

# 临时体验包构建：手动触发，一次产出三个平台的未签名安装包 artifact。
# - Windows: NSIS .exe
# - macOS: .dmg（Apple Silicon；Intel Mac 需改用 macos-13 runner）
# - Linux: .deb + .AppImage
# 不发布 GitHub Release、不要求签名密钥；更新端点未配置时应用会
# 在设置页诚实显示"更新服务未配置"。

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            bundles: nsis
            artifact: relaydesk-windows-nsis
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundles: dmg
            artifact: relaydesk-macos-dmg-arm64
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-24.04
            bundles: deb,appimage
            artifact: relaydesk-linux-deb-appimage
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          node --version
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build installer (${{ matrix.os }}, unsigned)
        run: pnpm tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # 汇总成功的平台产物，发布为滚动 pre-release，供公开下载（无需登录）。
  release:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: relaydesk-*
          merge-multiple: true
          path: dist

      - name: Publish rolling test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-build
          name: RelayDesk Test Build
          prerelease: true
          files: |
            dist/**/*.exe
            dist/**/*.dmg
            dist/**/*.deb
            dist/**/*.AppImage
          body: |
            未签名测试包。Windows 点"仍要运行"；macOS 需
            `xattr -dr com.apple.quarantine /Applications/RelayDesk.app`
            或右键打开；Linux 用 `.deb` 或 `.AppImage`（需 libfuse2）。
